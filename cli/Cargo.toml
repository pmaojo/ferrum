[package]
name = "ferrum-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for the Ferrum scaffolding system"

[dependencies]
ferrum-compiler = { path = "../compiler" }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
ferrum-engine = { path = "../engine" }
neo4rs = { version = "0.9.0-rc.6", features = ["json"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde_json = "1.0"
