[package]
name = "ferrum-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for the Ferrum scaffolding system"

[dependencies]
ferrum-compiler = { path = "../compiler" }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
ferrum-engine = { path = "../engine" }
neo4rs = { version = "0.9.0-rc.6", features = ["json"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde_json = "1.0"
diesel = { version = "2.1", features = ["postgres", "r2d2"] }
diesel_migrations = "2.1"
dotenvy = "0.15"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
regex = "1"
walkdir = "2"
