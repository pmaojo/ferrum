name: backend-migration-sqlite
version: 0.1.0
description: SQLite entity migration
author: Kthulu Framework
metadata:
  category: backend
  language: sql
  framework: kthulu
  custom:
    database: sqlite
files:
  - source: backend/migrations/migration.sql.tmpl
    destination: backend/migrations/{{ modules[0].name_snake }}_{{ modules[0].entities_info[0].name_snake }}.sql
    template: true
    condition: modules[0].entities_info | length > 0
variables: []
