name: backend-migration-mysql
version: 0.1.0
description: MySQL entity migration
author: Kthulu Framework
metadata:
  category: backend
  language: sql
  framework: kthulu
  custom:
    database: mysql
files:
  - source: backend/migrations/{{ (index .Modules 0).NameSnake }}_{{ (index (index .Modules 0).EntitiesInfo 0).NameSnake }}.sql.tmpl
    destination: backend/migrations/{{ (index .Modules 0).NameSnake }}_{{ (index (index .Modules 0).EntitiesInfo 0).NameSnake }}.sql
    template: true
    condition: gt (len (index (index .Modules 0).EntitiesInfo)) 0
variables: []
