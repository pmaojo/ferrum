# Generated by bench/gen_dsl.py -- do not edit by hand.
app:
  name: tier1
  title: Benchmark tier1
  version: 1.0.0
  database: postgres
  features: [auth, cron, "realtime-sse", uploads]
  auth:
    userEntity: user
    methods: [password, oauth]
    onAuthFailedRedirectTo: /login

modules:
  user:
    entity:
      fields:
        name: string
        code: string
        status: string
        quantity: int
        amount: float
        active: bool
        tenantId: uuid
        createdAt: timestamp
    usecases:
      createUser:
        input:
          id: uuid
          tenantId: uuid
          query: string
        output: User
        doc: Generated usecase for user
        steps: [user]
      getUser:
        input:
          id: uuid
        output: User
        doc: Generated usecase for user
        steps: [user]
      listUsers:
        input:
          limit: int
          offset: int
        output: "Vec<User>"
        doc: Generated usecase for user
        steps: [user]
  tenant:
    entity:
      fields:
        name: string
        code: string
        status: string
        quantity: int
        amount: float
        active: bool
        tenantId: uuid
        createdAt: timestamp
    usecases:
      createTenant:
        input:
          id: uuid
          tenantId: uuid
          query: string
        output: Tenant
        doc: Generated usecase for tenant
        steps: [tenant]
      getTenant:
        input:
          id: uuid
        output: Tenant
        doc: Generated usecase for tenant
        steps: [tenant]
      listTenants:
        input:
          limit: int
          offset: int
        output: "Vec<Tenant>"
        doc: Generated usecase for tenant
        steps: [tenant]

queries:
  - name: listUsers
    handler: ./backend/queries/list_user.rs
    entities: [User]
    cache:
      ttl: 60
      key: "user:list"
  - name: getUserById
    handler: ./backend/queries/get_user_by_id.rs
    entities: [User]
  - name: listTenants
    handler: ./backend/queries/list_tenant.rs
    entities: [Tenant]
    cache:
      ttl: 60
      key: "tenant:list"
  - name: getTenantById
    handler: ./backend/queries/get_tenant_by_id.rs
    entities: [Tenant]

mutations:
  - name: createUser
    handler: ./backend/mutations/create_user.rs
    entities: [User]
    authRequired: true
    policy: isAuthenticated
  - name: updateUser
    handler: ./backend/mutations/update_user.rs
    entities: [User]
    authRequired: true
    policy: isAdmin
  - name: createTenant
    handler: ./backend/mutations/create_tenant.rs
    entities: [Tenant]
    authRequired: true
    policy: isAuthenticated
  - name: updateTenant
    handler: ./backend/mutations/update_tenant.rs
    entities: [Tenant]
    authRequired: true
    policy: isOwner

routes:
  - name: user
    path: /user
    to: UserPage
    authRequired: true
    policy: isAuthenticated
  - name: tenant
    path: /tenant
    to: TenantPage
    authRequired: false
    policy: isPublic

pages:
  - name: UserPage
    component: UserPage.tsx
  - name: TenantPage
    component: TenantPage.tsx

jobs:
  - name: user_sync
    schedule: "0 2 * * *"
    handler: user.sync
    policy: isAdmin

entities:
  - name: BaseAudit
    fields:
      id: uuid
      occurredAt: timestamp
      actorId: uuid
  - name: UserAudit
    deriveFrom: BaseAudit
    fields:
      entityId: uuid
      action: string
      payload: string
  - name: TenantAudit
    deriveFrom: BaseAudit
    fields:
      entityId: uuid
      action: string
      payload: string

forms:
  - name: UserForm
    submitTo: createUser
    fields:
      name: string
      amount: float
      tenantId: uuid
    policy: isAuthenticated
  - name: TenantForm
    submitTo: createTenant
    fields:
      name: string
      amount: float
      tenantId: uuid
    policy: isAuthenticated

validations:
  - name: userIdIsValid
    appliesTo: user.createUser.id
    rule: id must be a valid uuid
  - name: userQueryIsValid
    appliesTo: user.createUser.query
    rule: query length must be between 1 and 200
  - name: userLimitIsValid
    appliesTo: user.listUsers.limit
    rule: limit must be greater than 0
  - name: tenantIdIsValid
    appliesTo: tenant.createTenant.id
    rule: id must be a valid uuid
  - name: tenantQueryIsValid
    appliesTo: tenant.createTenant.query
    rule: query length must be between 1 and 200

uploads:
  - name: userAsset
    path: /uploads/user

policies:
  - name: isAuthenticated
    guard: check_authenticated
  - name: isAdmin
    guard: check_admin
  - name: isOwner
    guard: check_owner
  - name: isPublic
    guard: always_allow
  - name: canManageUser
    guard: check_user

resources:
  - name: cache
    type: redis
    config:
      url: "redis://localhost:6379"
  - name: userQueue
    type: sqs
    config:
      queue: "user-events"

iot:
  - name: readUserSensor
    protocol: mqtt
    driver: rumqttc
    simulate: true
    code: |
      pub fn read_user_sensor() -> f32 {
          21.5
      }
    expose:
      method: GET
      path: /iot/user/sensor
      protocol: http
      generateHook: true
      generateComponent: true

vectorStores:
  - name: userEmbeddings
    embeddingModel: "text-embedding-3-small"
    dimensions: 1536

aiModels:
  - name: supportAssistant
    provider: openai
    model: "gpt-4o-mini"
    config:
      temperature: "0.2"

components:
  - name: UserCard
    props:
      - name: title
        type: string
      - name: amount
        type: float
      - name: active
        type: bool
  - name: TenantCard
    props:
      - name: title
        type: string
      - name: amount
        type: float
      - name: active
        type: bool
