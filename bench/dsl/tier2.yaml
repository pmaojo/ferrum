    path: /user
    to: UserPage
    authRequired: true
    policy: isAuthenticated
  - name: tenant
    path: /tenant
    to: TenantPage
    authRequired: false
    policy: isPublic
  - name: catalog
    path: /catalog
    to: CatalogPage
    authRequired: false
    policy: isPublic
  - name: inventory
    path: /inventory
    to: InventoryPage
    authRequired: true
