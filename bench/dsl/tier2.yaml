validations:
  - name: userIdIsValid
    appliesTo: user.createUser.id
    rule: id must be a valid uuid
  - name: userQueryIsValid
    appliesTo: user.createUser.query
    rule: query length must be between 1 and 200
  - name: userLimitIsValid
    appliesTo: user.listUsers.limit
    rule: limit must be greater than 0
  - name: tenantIdIsValid
    appliesTo: tenant.createTenant.id
    rule: id must be a valid uuid
  - name: tenantQueryIsValid
    appliesTo: tenant.createTenant.query
    rule: query length must be between 1 and 200
  - name: catalogIdIsValid
    appliesTo: catalog.createCatalog.id
    rule: id must be a valid uuid
  - name: catalogQueryIsValid
    appliesTo: catalog.createCatalog.query
    rule: query length must be between 1 and 200
  - name: catalogLimitIsValid
    appliesTo: catalog.listCatalogs.limit
    rule: limit must be greater than 0
  - name: inventoryIdIsValid
    appliesTo: inventory.createInventory.id
    rule: id must be a valid uuid
  - name: inventoryQueryIsValid
    appliesTo: inventory.createInventory.query
    rule: query length must be between 1 and 200
  - name: cartIdIsValid
    appliesTo: cart.createCart.id
    rule: id must be a valid uuid
  - name: cartQueryIsValid
    appliesTo: cart.createCart.query
    rule: query length must be between 1 and 200
  - name: cartLimitIsValid
    appliesTo: cart.listCarts.limit
    rule: limit must be greater than 0
  - name: orderIdIsValid
    appliesTo: order.createOrder.id
    rule: id must be a valid uuid
  - name: orderQueryIsValid
    appliesTo: order.createOrder.query
    rule: query length must be between 1 and 200
  - name: paymentIdIsValid
    appliesTo: payment.createPayment.id
    rule: id must be a valid uuid
  - name: paymentQueryIsValid
    appliesTo: payment.createPayment.query
    rule: query length must be between 1 and 200
  - name: paymentLimitIsValid
    appliesTo: payment.listPayments.limit
    rule: limit must be greater than 0
  - name: shipmentIdIsValid
    appliesTo: shipment.createShipment.id
    rule: id must be a valid uuid
  - name: shipmentQueryIsValid
    appliesTo: shipment.createShipment.query
    rule: query length must be between 1 and 200

uploads:
  - name: userAsset
    path: /uploads/user

policies:
  - name: isAuthenticated
    guard: check_authenticated
  - name: isAdmin
    guard: check_admin
  - name: isOwner
    guard: check_owner
  - name: isPublic
    guard: always_allow
  - name: canManageUser
    guard: check_user
  - name: canManageCart
    guard: check_cart

resources:
  - name: cache
    type: redis
    config:
      url: "redis://localhost:6379"
  - name: userQueue
    type: sqs
    config:
      queue: "user-events"
  - name: cartQueue
    type: sqs
    config:
      queue: "cart-events"

iot:
  - name: readUserSensor
    protocol: mqtt
    driver: rumqttc
    simulate: true
    code: |
      pub fn read_user_sensor() -> f32 {
          21.5
      }
    expose:
      method: GET
      path: /iot/user/sensor
      protocol: http
      generateHook: true
      generateComponent: true

