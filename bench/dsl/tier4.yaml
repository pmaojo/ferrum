    config:
      queue: "dashboard-events"

iot:
  - name: readUserSensor
    protocol: mqtt
    driver: rumqttc
    simulate: true
    code: |
      pub fn read_user_sensor() -> f32 {
          21.5
      }
    expose:
      method: GET
      path: /iot/user/sensor
      protocol: http
      generateHook: true
      generateComponent: true
