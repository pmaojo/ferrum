uploads:
  - name: userAsset
    path: /uploads/user
  - name: invoiceAsset
    path: /uploads/invoice
  - name: supplierAsset
    path: /uploads/supplier
  - name: couponAsset
    path: /uploads/coupon
  - name: auditAsset
    path: /uploads/audit

policies:
  - name: isAuthenticated
    guard: check_authenticated
  - name: isAdmin
    guard: check_admin
  - name: isOwner
    guard: check_owner
  - name: isPublic
    guard: always_allow
  - name: canManageUser
    guard: check_user
  - name: canManageCart
    guard: check_cart
  - name: canManageInvoice
    guard: check_invoice
  - name: canManagePricing
    guard: check_pricing
  - name: canManageSupplier
    guard: check_supplier
  - name: canManageLoyalty
    guard: check_loyalty
  - name: canManageCoupon
    guard: check_coupon
  - name: canManageSearch
    guard: check_search
  - name: canManageAudit
    guard: check_audit
  - name: canManageDashboard
    guard: check_dashboard

resources:
  - name: cache
    type: redis
    config:
      url: "redis://localhost:6379"
  - name: userQueue
    type: sqs
    config:
      queue: "user-events"
  - name: cartQueue
    type: sqs
    config:
      queue: "cart-events"
  - name: invoiceQueue
    type: sqs
    config:
      queue: "invoice-events"
  - name: pricingQueue
    type: sqs
    config:
      queue: "pricing-events"
  - name: supplierQueue
