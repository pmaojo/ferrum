# Docker Compose configuration for Ferrus project

services:
  engine:
    build: ./engine
    ports:
      - "3000:3000"
    volumes:
      - ./engine:/app
      - ./shared-models:/shared-models
    depends_on:
      - db

  studio:
    build: ./studio
    ports:
      - "5173:5173"
    volumes:
      - ./studio:/app
    depends_on:
      - engine
      - db
      - ferrum-ai
    environment:
      - DATABASE_URL=postgres://ferrum:password@db/ferrum
      - VITE_AI_URL=http://ferrum-ai:8000
      - VITE_ENGINE_URL=http://engine:3000

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ferrum
      POSTGRES_USER: ferrum
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  graphdb:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./data/neo4j:/data

  llm:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama

  ferrum-ai:
    build: ./ai
    ports:
      - "8001:8000"

    depends_on:
      - llm
    environment:
      - VITE_AI_URL=http://ferrum-ai:8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./ai:/app

  vector-db:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/vector:/qdrant/storage