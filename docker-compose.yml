# Docker Compose configuration for Ferrum project

services:
  engine:
    build: ./apps/engine
    ports:
      - "3001:3000"
    volumes:
      - ./apps/engine:/app
      - ./apps/shared-models:/shared-models
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ferrum
      POSTGRES_USER: ferrum
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  graphdb:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./data/neo4j:/data

  ferrum-ai:
    build: ./packages/ai
    ports:
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./packages/ai:/app

  vector-db:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/vector:/qdrant/storage

  semantic-gui:
    build: ./packages/semantic_gui
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://ferrum:password@db:5432/ferrum?sslmode=disable
      - DATABASE_HOST=db
      - DATABASE_USER=ferrum
      - DATABASE_PASSWORD=password
      - DATABASE_NAME=ferrum
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      - db
      - graphdb
      - ferrum-ai
    volumes:
      - ./packages/semantic_gui:/app
      - /app/node_modules
    working_dir: /app
    command: ['npm', 'start']
