# Docker Compose configuration for Ferrum project

services:
  engine:
    build: ./engine
    ports:
      - "3001:3000"
    volumes:
      - ./engine:/app
      - ./shared-models:/shared-models
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ferrum
      POSTGRES_USER: ferrum
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  graphdb:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./data/neo4j:/data

  ferrum-ai:
    build: ./ai
    ports:
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./ai:/app

  vector-db:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/vector:/qdrant/storage
  studio-web:
    image: rustlang/rust:nightly-slim
    working_dir: /workspace/studio-web
    command: >
      bash -c "apt-get update && apt-get install -y perl pkg-config libssl-dev make && \
      cargo install cargo-leptos && \
      cargo leptos serve -- --host 0.0.0.0"
    ports:
      - "3000:3000"
      - "3002:3001"
    volumes:
      - .:/workspace
    environment:
      - FERRUM_API_BASE_URL=http://ferrum-ai:8001
    depends_on:
      - ferrum-ai
