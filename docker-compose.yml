# Docker Compose configuration for Ferrus project

services:
  engine:
    build: ./engine
    ports:
      - "3000:3000"
    volumes:
      - ./engine:/app
      - ./shared-models:/shared-models
    depends_on:
      - db


  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ferrum
      POSTGRES_USER: ferrum
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  graphdb:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./data/neo4j:/data

  ferrum-ai:
    build: ./ai
    ports:
      - "8001:8000"
    environment:
      - OPENAI_API_KEY=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
    volumes:
      - ./ai:/app

  vector-db:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/vector:/qdrant/storage

  desktop:
    image: rust:1.75-slim
    working_dir: /workspace
    command: cargo run -p studio-desktop
    volumes:
      - .:/workspace
    depends_on:
      - engine
      - ferrum-ai
