[package]
name = "ferrum-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for the Ferrum scaffolding system"

[[bin]]
name = "ferrum"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tera = "1.20"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
ferrum-shared-models = { path = "../shared-models" }
ferrum-engine = { path = "../engine" }
ferrum-service = { path = "../ferrum-service" }
clap = { version = "4.6", features = ["derive"] }
Inflector = "0.11"
petgraph = "0.8"
ctrlc = "3.5"
toml = "0.9"
ferrum-compiler = { path = "../compiler" }
dotenvy = "0.15.7"
serde_json = "1.0.151"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
walkdir = "2"
diesel_migrations = "2.3"
sha2 = "0.11"
webbrowser = "1.2"
glob = "0.3.4"
dialoguer = "0.12"
diesel = { version = "2.3", default-features = false }
neo4rs = "0.8"

[features]
default = []
postgres = ["diesel/postgres"]

[dev-dependencies]
tempfile = "3"
base64 = "0.23"
serial_test = "4.0"
mockito = "1.7"
