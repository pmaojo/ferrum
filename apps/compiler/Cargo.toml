[package]
name = "ferrum-compiler"
version = "0.1.0"
edition = "2021"
description = "Compiler for the Ferrum scaffolding system"

[lib]
name = "ferrum_compiler"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tera = "1.20"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
ferrum-shared-models = { path = "../shared-models" }
Inflector = "0.11"
petgraph = "0.8"

[dev-dependencies]
tempfile = "3"
base64 = "0.21"
