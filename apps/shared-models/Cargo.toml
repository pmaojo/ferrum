[package]
name = "ferrum-shared-models"
version = "0.1.0"
edition = "2021"
description = "Shared models for the Ferrum scaffolding system"

[lib]
name = "ferrum_shared_models"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typeshare = "1.0"

[dev-dependencies]
tempfile = "3"
