[package]
name = "ferrum-engine"
version = "0.1.0"
edition = "2021"
description = "Engine for the Ferrum scaffolding system"

[lib]
name = "ferrum_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tera = "1.19"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
ferrum-shared-models = { path = "../shared-models" }
Inflector = "0.11"
petgraph = "0.6"
neo4rs = "0.6.1"

[dev-dependencies]
tempfile = "3"
base64 = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ferrum-compiler = { path = "../compiler" }
