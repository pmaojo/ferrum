[package]
name = "ferrum-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
neo4rs = { version = "0.9.0-rc.6", features = ["json"] }
ferrum-shared-models = { path = "../shared-models" }
async-graphql = "7"
lettre = { version = "0.11", features = ["builder", "smtp-transport"] }
oauth2 = "4"
jsonwebtoken = "9"
chrono = { version = "0.4", features=["serde"] }
serde = { version = "1.0", features=["derive"] }
toml = "0.7"
libloading = "0.8"
rumqttc = { version = "0.24", optional = true }
coap = { version = "0.22", optional = true }
tokio = { version = "1", features = ["full"], optional = true }

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"
ferrum-compiler = { path = "../compiler" }
rumqttd = "0.19"

[features]
default = []
mqtt = ["dep:rumqttc", "dep:tokio"]
coap = ["dep:coap", "dep:tokio"]
