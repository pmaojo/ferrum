[package]
name = "ferrum-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
neo4rs = { version = "0.9.0-rc.6", features = ["json"] }
ferrum-shared-models = { path = "../shared-models" }
async-graphql = "7"
lettre = { version = "0.11", features = ["builder", "smtp-transport"] }
oauth2 = "4"
jsonwebtoken = "9"
chrono = { version = "0.4", features=["serde"] }
serde = { version = "1.0", features=["derive"] }
toml = "0.7"
libloading = "0.8"

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"
ferrum-compiler = { path = "../compiler" }
