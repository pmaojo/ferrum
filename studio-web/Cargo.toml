[package]
name = "studio-web"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = "0.5"
leptos_router = "0.5"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
ferrum-shared-models = { path = "../shared-models" }
serde_yaml = "0.9"
once_cell = "1.19"
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1"

[dev-dependencies]
mockito = "1"
tokio = { version = "1.37", features = ["macros", "rt"] }

[features]
default = []
test-api = []

