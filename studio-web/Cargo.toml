[package]
name = "studio-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "studio-web"
path = "src/main.rs"

[lib]
name = "studio_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ferrum-shared-models = { path = "../shared-models" }
serde_yaml = "0.9"
once_cell = "1.19"
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1"
leptos = "0.5"
leptos_router = "0.5"
reqwest-wasm = { version = "0.11", features = ["json"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
webbrowser = "0.8"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.6"
leptos_axum = "0.5"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
mockito = "1"

[features]
default = ["csr"]
csr = ["leptos/csr", "leptos_router/csr"]
test-api = []

