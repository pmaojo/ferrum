[package]
name = "studio-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "studio-web"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
ferrum-shared-models = { path = "../shared-models" }
serde_yaml = "0.9"
once_cell = "1.19"
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.5", features = ["csr"] }
leptos_router = { version = "0.5", features = ["csr"] }
reqwest-wasm = { version = "0.11", features = ["json"] }

[dev-dependencies]
mockito = "1"
tokio = { version = "1.37", features = ["macros", "rt"] }

[features]
default = ["csr"]
csr = ["leptos/csr", "leptos_router/csr"]
test-api = []

