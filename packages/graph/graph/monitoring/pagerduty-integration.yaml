apiVersion: monitoring.coreos.com/v1
kind: AlertmanagerConfig
metadata:
  name: pagerduty-alerts
  namespace: monitoring
spec:
  route:
    receiver: pagerduty-critical
    group_by: ['alertname', 'job']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
    - receiver: pagerduty-critical
      match:
        severity: critical
      continue: true
    - receiver: pagerduty-warning
      match:
        severity: warning
      continue: true
  
  receivers:
  - name: pagerduty-critical
    pagerduty_configs:
    - routing_key:
        name: pagerduty-key
        key: integration-key
      description: "{{ .CommonAnnotations.summary }}"
      details:
        firing: "{{ .Alerts.Firing | len }}"
        description: "{{ .CommonAnnotations.description }}"
        runbook: "{{ .CommonAnnotations.runbook_url }}"
      severity: critical
      class: "production"
      component: "graphrag"
      group: "graphrag-ontology-app"
      
  - name: pagerduty-warning
    pagerduty_configs:
    - routing_key:
        name: pagerduty-key
        key: integration-key
      description: "{{ .CommonAnnotations.summary }}"
      details:
        firing: "{{ .Alerts.Firing | len }}"
        description: "{{ .CommonAnnotations.description }}"
        runbook: "{{ .CommonAnnotations.runbook_url }}"
      severity: warning
      class: "production"
      component: "graphrag"
      group: "graphrag-ontology-app"