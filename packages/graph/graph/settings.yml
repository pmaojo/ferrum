# GraphRAG Configuration supporting both Microsoft GraphRAG and FalkorDB GraphRAG SDK

tiny_mode: false

# HyDRA feature configuration
hydra:
  enabled: true
  features:
    persona_generation: true
    scope_generation: true
    cq_generation: true
  llm:
    model: ${HYDRA_LLM_MODEL}
    temperature: ${HYDRA_TEMPERATURE}
    max_tokens: ${HYDRA_MAX_TOKENS}

# FalkorDB GraphRAG SDK Configuration
# This configures the GraphRAG SDK to use FalkorDB with Gemini models

graphrag_sdk:
  # FalkorDB connection
  host: localhost
  port: 6379
  username: ${FALKORDB_USER}
  password: ${FALKORDB_PASSWORD}

  # LLM Configuration
  llm_model: gemini-2.5-flash
  embedding_model: text-embedding-3-small
  # API key for the selected LLM provider
  api_key: ${GRAPHRAG_API_KEY}

  # Query settings
  max_tokens: 4096
  temperature: 0.1

# FalkorDB GraphRAG SDK Configuration
falkordb_graphrag:
  # Database connection
  host: "127.0.0.1"
  port: 6379
  username: ${FALKORDB_USERNAME}  # Optional
  password: ${FALKORDB_PASSWORD}  # Optional

  # LiteLLM model configuration
  model_name: "gemini/gemini-2.0-flash"  # Using Gemini via LiteLLM

  # Ontology configuration
  ontology_path: "./ontology.json"  # Optional: path to predefined ontology

  # Agent configuration
  agents:
    default_backstory: "You are an intelligent assistant with access to knowledge graphs containing structured information about various domains."

  # Multi-agent orchestration
  orchestration:
    enable_multi_agent: true
    default_orchestrator_backstory: "You are a smart orchestrator managing specialized knowledge graph agents to provide comprehensive answers."

# Input configuration
input:
  type: file
  file_type: text
  base_dir: "./input"
  encoding: utf-8

# Output configuration  
output:
  type: file
  base_dir: "./output"

# Cache configuration
cache:
  type: file
  base_dir: "./cache"

# Workflow configurations
workflows:
  - create_base_text_units
  - create_base_extracted_entities
  - create_summarized_entities
  - create_base_entity_graph
  - create_final_entities
  - create_final_nodes
  - create_final_communities
  - create_final_relationships
  - create_final_documents
  - create_base_text_units
  - create_final_text_units

# Graph extraction settings
extract_graph:
  model_id: default_chat_model
  max_gleanings: 1
  entity_types:
    - PERSON
    - ORGANIZATION
    - LOCATION
    - EVENT
    - CONCEPT

# Community reports
community_reports:
  model_id: default_chat_model
  max_length: 2000
  max_input_length: 8000

# Text summarization
summarize_descriptions:
  model_id: default_chat_model
  max_length: 500

# Clustering settings
cluster_graph:
  max_cluster_size: 10
  use_lcc: true

# Query settings
local_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  max_context_tokens: 8000
  top_k_entities: 10
  top_k_relationships: 10

global_search:
  chat_model_id: default_chat_model
  max_context_tokens: 8000
  map_max_length: 1000
  reduce_max_length: 2000
