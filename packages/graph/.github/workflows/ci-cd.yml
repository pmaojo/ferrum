name: GraphRAG Ontology App CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly security scans
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          pip install -e .[dev]
      
      - name: Lint with ruff
        run: |
          ruff check --output-format=github .
          
      - name: Format check with ruff
        run: |
          ruff format --check .

      - name: Lint with flake8
        run: |
          flake8
      
      - name: Type check with mypy
        run: |
          mypy --strict --junit-xml=mypy-report.xml domain/ application/ adapters/ ui_adapters/
          
      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: mypy-report
          path: mypy-report.xml
          
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
          
      - name: Run Bandit security scan
        run: |
          bandit -r domain application adapters ui_adapters -f json -o bandit-report.json
          
      - name: Check dependencies for vulnerabilities
        run: |
          safety check -r requirements.txt --json > safety-report.json
          
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint, security-scan]
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist hypothesis testcontainers memory-profiler
          pip install -e .[dev]
      
      - name: Run unit tests with parallelization
        run: |
          pytest -q tests/ --ignore=tests/integration/ --ignore=tests/performance/ -xvs --cov=domain --cov=application --cov=adapters --cov=ui_adapters --cov-report=xml --cov-report=html -n auto
      
      - name: Run property-based tests
        run: |
          pytest -q tests/test_domain_entities_validation.py::test_triple_property_based -v
      
      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov testcontainers pytest-testcontainers
          pip install -e .[dev]
      
      - name: Run integration tests with TestContainers
        run: |
          pytest -q tests/integration/ --cov=adapters --cov-report=xml --cov-report=html -v
        env:
          CI_WITH_DOCKER: true
          USE_TESTCONTAINERS: true
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
          MOCK_GRAPHRAG: true
      
      - name: Run FalkorDB query execution tests
        run: |
          pytest -q tests/integration/test_falkordb_query_execution.py -v
        env:
          CI_WITH_DOCKER: true
          USE_TESTCONTAINERS: true
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
      
      - name: Upload integration coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          
      - name: Upload HTML integration coverage report
        uses: actions/upload-artifact@v3
        with:
          name: integration-coverage-report
          path: htmlcov/

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest memory-profiler locust pytest-benchmark testcontainers
          pip install -e .[dev]
      
      - name: Run memory profiling tests
        run: |
          pytest -q tests/test_graph_visualization_memory.py -v
          
      - name: Run performance benchmarks
        run: |
          pytest -q tests/performance/ --benchmark-json=benchmark.json --benchmark-columns=mean,median,min,max,rounds,iterations
        env:
          CI_WITH_DOCKER: true
          USE_TESTCONTAINERS: true
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
          MOCK_GRAPHRAG: true
      
      - name: Run locust performance test (headless)
        run: |
          locust -f tests/performance/locustfile.py --headless -u 10 -r 1 --run-time 30s --host http://localhost:8000 --html=locust-report.html
        env:
          MOCK_GRAPHRAG: true
          
      - name: Upload performance reports
        uses: actions/upload-artifact@v3
        with:
          name: performance-reports
          path: |
            benchmark.json
            locust-report.html
            
      - name: Verify performance SLAs
        run: |
          python -c "
          import json
          with open('benchmark.json') as f:
              data = json.load(f)
          for benchmark in data['benchmarks']:
              if 'query_execution' in benchmark['name'] and benchmark['stats']['mean'] > 0.350:
                  print(f'SLA violation: {benchmark[\"name\"]} mean time {benchmark[\"stats\"][\"mean\"]:.3f}s exceeds 350ms threshold')
                  exit(1)
          print('All performance SLAs met')
          "

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, integration-test, performance-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64,amd64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Sign the images with Cosign
        uses: sigstore/cosign-installer@main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      
      - name: Sign container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.0.0
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      
      - name: Deploy to EKS
        run: |
          cd terraform/environments/staging
          terraform init
          terraform apply -auto-approve
      
      - name: Update ArgoCD application
        run: |
          echo "Updating ArgoCD application with new image tag: ${{ github.sha }}"
          # This would typically use ArgoCD CLI or API to update the image tag
          # For example:
          # argocd app set graphrag-ontology-app --parameter image.tag=${{ github.sha }}
      
      - name: Verify deployment
        run: |
          echo "Verifying deployment health..."
          # This would typically check deployment status and run smoke tests
          # For example:
          # kubectl wait --for=condition=available --timeout=300s deployment/graphrag-api -n graphrag

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.0.0
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      
      - name: Deploy to EKS
        run: |
          cd terraform/environments/production
          terraform init
          terraform apply -auto-approve
      
      - name: Update ArgoCD application
        run: |
          echo "Updating ArgoCD application with new image tag: ${{ github.sha }}"
          # This would typically use ArgoCD CLI or API to update the image tag
      
      - name: Verify deployment
        run: |
          echo "Verifying deployment health..."
          # This would typically check deployment status and run smoke tests
      
      - name: Run canary analysis
        run: |
          echo "Running canary analysis..."
          # This would typically use a tool like Flagger to analyze canary deployment
      
      - name: Validate SLAs
        run: |
          echo "Validating SLAs..."
          # This would check if the deployment meets SLA requirements (latency < 350ms)

  monitoring-setup:
    name: Setup Monitoring
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.10.0'
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.25.0'
      
      - name: Get kubeconfig
        run: |
          aws eks update-kubeconfig --name graphrag-cluster --region us-west-2
      
      - name: Deploy OpenTelemetry Collector
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update
          helm upgrade --install otel-collector open-telemetry/opentelemetry-collector \
            --namespace monitoring --create-namespace \
            -f monitoring/otel-collector-values.yaml
      
      - name: Deploy Prometheus and Grafana
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            -f monitoring/prometheus-values.yaml
      
      - name: Setup Grafana dashboards
        run: |
          echo "Setting up Grafana dashboards..."
          kubectl apply -f monitoring/dashboards/graphrag-overview-dashboard.yaml
          kubectl apply -f monitoring/dashboards/graphrag-performance-dashboard.yaml
          kubectl apply -f monitoring/dashboards/graphrag-validation-dashboard.yaml
      
      - name: Configure alerts
        run: |
          echo "Configuring alerts..."
          kubectl apply -f monitoring/alerts/latency-alerts.yaml
          kubectl apply -f monitoring/alerts/validation-failure-alerts.yaml
          kubectl apply -f monitoring/alerts/error-rate-alerts.yaml
      
      - name: Setup PagerDuty integration
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl create secret generic pagerduty-key \
            --namespace monitoring \
            --from-literal=integration-key=${{ secrets.PAGERDUTY_KEY }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f monitoring/pagerduty-integration.yaml