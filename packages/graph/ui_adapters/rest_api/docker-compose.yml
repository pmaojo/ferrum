version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: ui_adapters/rest_api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PERMAGRAPH_API_KEY=${PERMAGRAPH_API_KEY:-default-key-change-me}
      - TOKEN_BUDGET_STORAGE_PATH=/data/token_budget
      - DEFAULT_MONTHLY_BUDGET_USD=100.0
      - ALERT_THRESHOLD_PERCENT=80.0
      - ENABLE_DEGRADATION=true
      - DEFAULT_COMPRESSION_RATIO=0.7
      - MIN_TRIPLES=10
      - USE_EMBEDDINGS=true
      - LLM_ERROR_THRESHOLD=5
      - LLM_LATENCY_THRESHOLD_MS=800
      - LLM_RESET_TIMEOUT_SECONDS=60
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PERMAGRAPH_API_KEY=default-key-change-me
      - FALKORDB_CONNECTION_STRING=redis://redis:6379
      - JOB_REPOSITORY_URL=redis://redis:6379/1
    volumes:
      - permagraph_data:/data
    depends_on:
      redis:
        condition: service_healthy
      prometheus:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.0.3
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

volumes:
  permagraph_data:
  redis_data:
  prometheus_data:
  grafana_data: