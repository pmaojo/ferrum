[package]
name = "studio-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.13"
bevy_egui = "0.26"
egui_extras = { version = "0.26", features = ["svg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "blocking"] }
bevy-tokio-tasks = "0.16"
serde_yaml = "0.9"
once_cell = "1.19"
webbrowser = "0.8"

[dev-dependencies]
mockito = "1"
